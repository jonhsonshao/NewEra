<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七号｜闪兑交易 NewEra</title>
<script src="https://cdn.jsdelivr.net/npm/web3@4.8.0/dist/web3.min.js"></script>
<link rel="stylesheet" href="style.css">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Roboto,system-ui,sans-serif;
}
:root{
    --era-blue:#00b8ff;
    --main-gradient:linear-gradient(90deg,#00b8ff,#924cff);
    --bg-dark:#050510;
    --card-bg:rgba(20,20,40,0.7);
    --text-light:#e8edff;
}
body{
    background-color:var(--bg-dark);
    color:var(--text-light);
    min-height:100vh;
}
.main-wrap-pool{
    max-width:900px;
    margin:30px auto;
    padding:0 20px;
}
.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    background:rgba(0,184,255,0.12);
    border:1px solid rgba(0,184,255,0.3);
    border-radius:8px;
    color:var(--era-blue);
    cursor:pointer;
    margin-bottom:30px;
    transition:0.3s;
}
.back-btn:hover{
    background:rgba(0,184,255,0.25);
}
.page-title{
    text-align:center;
    font-size:32px;
    margin-bottom:16px;
    font-weight:700;
}
.page-title .icon-emoji{
    font-size:34px;
    margin-right:8px;
}
.page-title .gradient-text{
    background:var(--main-gradient);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
}
.swap-card{
    background:var(--card-bg);
    border:1px solid rgba(0,184,255,0.45);
    border-radius:18px;
    padding:28px;
    margin-bottom:24px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 18px rgba(0, 184, 255, 0.28);
    position:relative;
    overflow:hidden;
}
.swap-card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:1px;
    background:linear-gradient(90deg,transparent,#00d4ff,transparent);
    box-shadow:0 0 10px rgba(0,212,255,0.8);
}
.swap-card h2{
    color:#7fdfff;
    margin-bottom:20px;
    font-size:22px;
    text-align:center;
}
.rate-tip{
    text-align:center;
    margin-bottom:22px;
    color:#b8dcff;
}
.input-wrap{
    margin-bottom:18px;
}
.input-wrap label{
    display:block;
    margin-bottom:8px;
    color:#c8d8ee;
}
.input-wrap input{
    width:100%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(0,184,255,0.3);
    border-radius:10px;
    padding:14px;
    color:#fff;
    font-size:16px;
}
.result-row{
    padding:14px;
    background:rgba(255,255,255,0.05);
    border-radius:10px;
    margin-bottom:22px;
}
.result-row span{
    color:#7fdfff;
}
.swap-btn{
    width:100%;
    padding:14px 0;
    border-radius:10px;
    border:1px solid rgba(120, 220, 255, 0.6);
    background: linear-gradient(90deg, #0088ff, #00d4ff);
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 12px rgba(0,184,255,0.7);
    transition:all 0.25s ease;
}
.swap-btn:hover:not(:disabled){
    filter:brightness(1.2);
    box-shadow:0 0 20px rgba(0,212,255,0.9);
}
.swap-btn:disabled{
    background:#222c44;
    border-color:rgba(120,160,220,0.25);
    box-shadow:none;
    cursor:not-allowed;
    color:#8fa5c7;
}
@media(max-width:600px){
    .page-title{
        font-size:26px;
    }
    .swap-card{
        padding:20px;
    }
}
</style>
</head>
<body>
<header class="header-bar">
    <div class="logo-wrap" onclick="location.href='index.html'">
        <img src="logo.png" alt="Logo" class="logo-img">
        <div class="logo-text">NewEra</div>
    </div>
    <div class="header-right">
        <div class="wallet-box" id="walletBtn">连接钱包</div>
        <div class="menu-trigger" id="menuBtn">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</header>

<div class="side-nav" id="sideMenu">
    <h3>导航菜单</h3>
    <div class="nav-item" onclick="location.href='index.html'">🏠首页</div>

    <div class="nav-item" onclick="toggleFundMenu()">
        🏛️基金会
        <span id="fundArrow">▼</span>
    </div>
    <div class="sub-nav-wrap" id="fundSubMenu">
        <div class="sub-nav-item" onclick="location.href='pool1.html'">一号基金会</div>
        <div class="sub-nav-item" onclick="location.href='pool2.html'">二号基金会</div>
        <div class="sub-nav-item" onclick="location.href='pool3.html'">三号基金会</div>
    </div>

    <div class="nav-item" onclick="location.href='pool5.html'">🚀公平发射</div>
    <div class="nav-item" onclick="location.href='pool6.html'">🎁空投</div>
    <div class="nav-item" onclick="location.href='pool7.html'">⚡闪兑交易</div>
    <div class="nav-item" onclick="location.href='pool4.html'">📈质押生息</div>
    <div class="nav-item" onclick="location.href='pool6.html'">📃 借贷合约</div>
    <div class="nav-item" onclick="location.href='user.html'">👤用户中心</div>
    <div class="nav-item" onclick="location.href='rule.html'">📜代币发行与获取规则</div>
    <div class="nav-item" onclick="location.href='share.html'">📤我的推广链接</div>
</div>
<div class="mask-overlay" id="maskOverlay"></div>

<div class="main-wrap-pool">
    <div class="back-btn" onclick="history.back()">← 返回上一页</div>
    <h1 class="page-title">
        <span class="icon-emoji">⚡</span>
        <span class="gradient-text">闪兑交易</span>
    </h1>

    <div class="swap-card">
        <h2>NEW 兑换 USDT</h2>
        <div class="rate-tip">兑换汇率：<strong>1000 NEW = 1 USDT</strong></div>

        <div class="input-wrap">
            <label>输入要兑换的 NEW 数量</label>
            <input type="number" id="inputNew" placeholder="请输入NEW数量，必须为1000的整数倍" min="0" step="1000">
        </div>

        <div class="result-row">
            可获得 USDT：<span id="outUsdt">0</span>
        </div>

        <button class="swap-btn" id="swapBtn" disabled>执行闪兑</button>
    </div>
</div>

<script src="common.js"></script>
<script>
const inputNew = document.getElementById('inputNew');
const outUsdt = document.getElementById('outUsdt');
const swapBtn = document.getElementById('swapBtn');

// 汇率：1000 NEW = 1 USDT
const RATE_NEW_PER_USDT = 1000;

function calcOutput(){
    const val = Number(inputNew.value || 0);
    let usdtVal = 0;
    if(val > 0 && Number.isInteger(val / RATE_NEW_PER_USDT)){
        usdtVal = val / RATE_NEW_PER_USDT;
        swapBtn.disabled = !currentAccount;
    }else{
        swapBtn.disabled = true;
    }
    outUsdt.innerText = usdtVal.toString();
}

inputNew.addEventListener('input', calcOutput);

swapBtn.onclick = async function(){
    if(!currentAccount){
        alert("请先连接钱包");
        return;
    }
    const newAmount = Number(inputNew.value);
    if(newAmount <=0 || (newAmount % RATE_NEW_PER_USDT !== 0)){
        alert("输入错误，兑换数量必须是1000的整数倍");
        return;
    }
    const getUsdt = newAmount / RATE_NEW_PER_USDT;

    const ok = confirm(`确认闪兑：\n扣除 ${newAmount} NEW\n获得 ${getUsdt} USDT\n\n【仅前端模拟演示，无真实链上交易】`);
    if(!ok) return;

    // 本地模拟记录兑换记录
    const recordKey = "swap_record_" + currentAccount.toLowerCase();
    const list = JSON.parse(localStorage.getItem(recordKey) || "[]");
    list.push({
        time:Date.now(),
        burnNew:newAmount,
        receiveUsdt:getUsdt
    });
    localStorage.setItem(recordKey, JSON.stringify(list));

    alert(`✅ 闪兑模拟完成\n扣除NEW：${newAmount}\n得到USDT：${getUsdt}\n记录已保存到本地浏览器`);
    inputNew.value = "";
    calcOutput();
};

// 钱包状态变化刷新按钮状态
window.addEventListener("walletConnected", calcOutput);
window.addEventListener("walletDisconnected", calcOutput);
window.addEventListener("accountsChanged", calcOutput);
window.addEventListener("DOMContentLoaded", calcOutput);
</script>
</body>
</html>
