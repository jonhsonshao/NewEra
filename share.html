<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewEra｜我的推广链接</title>
<script src="https://cdn.jsdelivr.net/npm/web3@4.8.0/dist/web3.min.js"></script>
<link rel="stylesheet" href="style.css">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Roboto,system-ui,sans-serif;
}
:root{
    --era-blue:#00b8ff;
    --era-purple:#924cff;
    --main-gradient:linear-gradient(90deg,#00b8ff,#924cff);
    --bg-dark:#050510;
    --card-bg:rgba(20,20,40,0.7);
    --text-light:#e8edff;
}
body{
    background-color:var(--bg-dark);
    color:var(--text-light);
    min-height:100vh;
}
.main-wrap-share{
    max-width:900px;
    margin:30px auto;
    padding:0 20px;
}
.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    background:rgba(0,184,255,0.12);
    border:1px solid rgba(0,184,255,0.3);
    border-radius:8px;
    color:var(--era-blue);
    cursor:pointer;
    margin-bottom:30px;
    transition:0.3s;
}
.back-btn:hover{
    background:rgba(0,184,255,0.25);
}
.page-title{
    text-align:center;
    font-size:36px;
    background:var(--main-gradient);
    -webkit-background-clip:text;
    color:transparent;
    margin-bottom:32px;
    font-weight:700;
}
.share-card{
    background:var(--card-bg);
    border:1px solid rgba(0,184,255,0.25);
    border-radius:16px;
    padding:28px;
    margin-bottom:24px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 18px rgba(0, 184, 255, 0.35);
}
.share-card h2{
    margin-bottom:16px;
    color:var(--era-blue);
}
.link-box{
    background:rgba(255,255,255,0.06);
    border-radius:10px;
    padding:14px;
    word-break:break-all;
    margin-bottom:16px;
}
.copy-btn{
    width:100%;
    padding:12px 0;
    border:none;
    border-radius:10px;
    background:var(--main-gradient);
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
.tip-text{
    margin-top:14px;
    font-size:14px;
    opacity:0.7;
    line-height:1.6;
}
@media(max-width:600px){
    .page-title{
        font-size:26px;
    }
    .share-card{
        padding:20px;
    }
}
</style>
</head>
<body>
<header class="header-bar">
    <div class="logo-wrap" onclick="location.href='index.html'">
        <img src="logo.png" alt="Logo" class="logo-img">
        <div class="logo-text">NewEra</div>
    </div>
    <div class="header-right">
        <div class="wallet-box" id="walletBtn">连接钱包</div>
        <div class="menu-trigger" id="menuBtn">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</header>

<div class="side-nav" id="sideMenu">
    <h3>导航菜单</h3>
    <div class="nav-item" onclick="location.href='index.html'">🏠首页</div>

    <div class="nav-item" onclick="toggleFundMenu()">
        🏛️基金会
        <span id="fundArrow">▼</span>
    </div>
    <div class="sub-nav-wrap" id="fundSubMenu">
        <div class="sub-nav-item" onclick="location.href='pool1.html'">一号基金会</div>
        <div class="sub-nav-item" onclick="location.href='pool2.html'">二号基金会</div>
        <div class="sub-nav-item" onclick="location.href='pool3.html'">三号基金会</div>
    </div>

    <div class="nav-item" onclick="location.href='pool5.html'">🚀公平发射</div>
    <div class="nav-item" onclick="location.href='pool6.html'">🎁空投</div>
    <div class="nav-item" onclick="location.href='pool4.html'">⚡闪兑交易</div>
    <div class="nav-item" onclick="location.href='pool5.html'">📈质押生息</div>
    <div class="nav-item" onclick="location.href='pool6.html'">📃 借贷合约</div>
    <div class="nav-item" onclick="location.href='user.html'">👤用户中心</div>
    <div class="nav-item" onclick="location.href='rule.html'">📜代币发行与获取规则</div>
    <div class="nav-item" onclick="location.href='share.html'">📤我的推广链接</div>
</div>
<div class="mask-overlay" id="maskOverlay"></div>

<div class="main-wrap-share">
    <div class="back-btn" onclick="history.back()">← 返回上一页</div>
    <h1 class="page-title">我的推广链接</h1>

    <div class="share-card">
        <h2>个人推广链接</h2>
        <div class="link-box" id="refLinkBox">请先连接钱包生成链接</div>
        <button class="copy-btn" id="copyLinkBtn">复制推广链接</button>
        <div class="tip-text">
            将链接分享给好友，好友通过你的链接进入并连接钱包，自动绑定你的为上级推荐人，推荐关系终身只绑定一次。
        </div>
    </div>
</div>

<script src="common.js"></script>
<script>
const refLinkBox = document.getElementById('refLinkBox');
const copyLinkBtn = document.getElementById('copyLinkBtn');
let shareUrl = '';

function refreshShareLink(){
    if(!currentAccount){
        refLinkBox.innerText = "请先连接钱包生成链接";
        shareUrl = '';
        copyLinkBtn.disabled = true;
        return;
    }
    shareUrl = `${window.location.origin}/index.html?ref=${currentAccount}`;
    refLinkBox.innerText = shareUrl;
    copyLinkBtn.disabled = false;
}

copyLinkBtn.onclick = async function(){
    if(!shareUrl) return;
    try{
        await navigator.clipboard.writeText(shareUrl);
        alert("✅推广链接已复制");
    }catch(e){
        alert("复制失败，请手动复制");
    }
};

window.addEventListener("walletConnected",refreshShareLink);
window.addEventListener("walletDisconnected",refreshShareLink);
window.addEventListener("accountsChanged",refreshShareLink);
window.addEventListener('DOMContentLoaded',refreshShareLink);
</script>
</body>
</html>
